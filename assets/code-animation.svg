<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">

  <defs>
    <linearGradient id="cyanGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="#000000"/>

  <!-- Animated code icon -->
  <g transform="translate(600 120)" filter="url(#glow)">

    <path
      d="M -90 -30 L -125 0 L -90 30"
      stroke="url(#cyanGradient)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-10 0;0 0"
        dur="2s"
        repeatCount="indefinite"/>
    </path>

    <path
      d="M 90 -30 L 125 0 L 90 30"
      stroke="url(#cyanGradient)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;10 0;0 0"
        dur="2s"
        repeatCount="indefinite"/>
    </path>

    <path
      d="M 15 -55 L -15 55"
      stroke="#ffffff"
      stroke-width="6"
      stroke-linecap="round">

      <animateTransform
        attributeName="transform"
        type="rotate"
        values="-4 0 0;4 0 0;-4 0 0"
        dur="2s"
        repeatCount="indefinite"/>
    </path>

  </g>

  <!-- Terminal -->
  <rect
    x="300"
    y="210"
    width="600"
    height="150"
    rx="15"
    fill="#07090d"
    stroke="#1f2937"/>

  <!-- Terminal buttons -->
  <circle cx="330" cy="235" r="6" fill="#ef4444"/>
  <circle cx="350" cy="235" r="6" fill="#f59e0b"/>
  <circle cx="370" cy="235" r="6" fill="#10b981"/>

  <!-- Terminal title -->
  <text
    x="405"
    y="241"
    fill="#64748b"
    font-size="15"
    font-family="monospace">
    farid@github: ~/profile
  </text>

  <!-- Code -->
  <text
    x="360"
    y="285"
    fill="#ffffff"
    font-size="22"
    font-family="monospace">
    const developer = {
  </text>

  <text
    x="390"
    y="318"
    fill="#22d3ee"
    font-size="22"
    font-family="monospace">
    name: "Farid",
  </text>

  <text
    x="390"
    y="350"
    fill="#ffffff"
    font-size="22"
    font-family="monospace">
    role: "Front-end Developer"
  </text>

  <!-- Blinking cursor -->
  <rect
    x="755"
    y="330"
    width="11"
    height="24"
    rx="2"
    fill="#22d3ee">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>
  </rect>

</svg>
